name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests use in-memory SQLite via conftest override — no real DB needed
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      JWT_SECRET_KEY: ci-test-secret
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install aiosqlite pytest-asyncio anyio

      - name: Lint
        run: |
          pip install ruff
          ruff check app/ tests/

      - name: Run tests
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t almatour-api:${{ github.sha }} .
